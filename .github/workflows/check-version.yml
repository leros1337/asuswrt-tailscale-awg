name: Check for a new Tailscale-AWG version

on:
  schedule:
    - cron: '0 4,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read current pin
        id: pin
        run: |
          . ./.config/tailscale-version
          {
            echo "repo=$TAILSCALE_REPO"
            echo "current=$TAILSCALE_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Find the newest stable tag of the fork
        id: latest
        uses: actions/github-script@v7
        with:
          script: |
            const [owner, repo] = '${{ steps.pin.outputs.repo }}'.split('/');
            const { data: tags } = await github.rest.repos.listTags({ owner, repo, per_page: 100 });
            const stable = tags
              .map(t => t.name)
              .filter(n => /^v\d+\.\d+\.\d+$/.test(n))
              .sort((a, b) => {
                const p = v => v.slice(1).split('.').map(Number);
                const [a1,a2,a3] = p(a), [b1,b2,b3] = p(b);
                return b1-a1 || b2-a2 || b3-a3;
              });
            if (!stable.length) throw new Error('no stable tags found');
            core.setOutput('tag', stable[0]);
            core.setOutput('version', stable[0].slice(1));

      - name: Update the pin
        id: bump
        run: |
          new="${{ steps.latest.outputs.version }}"
          cur="${{ steps.pin.outputs.current }}"
          if [ "$new" = "$cur" ]; then
            echo "already at $cur"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$(git ls-remote "https://github.com/${{ steps.pin.outputs.repo }}.git" \
                  "refs/tags/${{ steps.latest.outputs.tag }}" | cut -f1)
          [ -n "$sha" ] || { echo "could not resolve tag commit" >&2; exit 1; }
          sed -i \
            -e "s/^TAILSCALE_VERSION=.*/TAILSCALE_VERSION=$new/" \
            -e "s/^TAILSCALE_TAG=.*/TAILSCALE_TAG=${{ steps.latest.outputs.tag }}/" \
            -e "s/^UPSTREAM_COMMIT=.*/UPSTREAM_COMMIT=$sha/" \
            .config/tailscale-version
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Commit
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .config/tailscale-version
          git commit -m "chore: update tailscale to v${{ steps.bump.outputs.version }} (${{ steps.bump.outputs.sha }})"
          git push origin main

      - name: Trigger the build
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: build-asuswrt
          token: ${{ secrets.PAT_TOKEN || github.token }}
