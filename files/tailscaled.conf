# /opt/etc/tailscale/tailscaled.conf -- sourced by S60tailscaled and firewall.sh.
# This is an opkg conffile: your edits survive package upgrades.

# Extra flags appended to the tailscaled command line.
EXTRA_ARGS=""

# WireGuard listen port. Opened in INPUT by firewall.sh.
PORT=41641

# Leave at "off". tailscaled's own netfilter rules do not survive Merlin's
# firewall rebuilds; firewall.sh owns the rules instead. Only change this when
# debugging, and expect to lose connectivity on the next WAN event.
#
# This is a `tailscale up` preference, not a daemon flag: install.sh reads it
# from here and passes it to `tailscale up`, after which it persists in
# tailscaled.state. Changing it here needs a `tailscale up --netfilter-mode=...`
# to take effect.
NETFILTER_MODE=off

# Informational: the CIDRs you passed to `tailscale up --advertise-routes=`.
# Not applied by the daemon; recorded here so `install.sh status` can show it.
ADVERTISE_ROUTES=""

# Set to 1 if this router advertises itself as an exit node. Informational.
EXIT_NODE=0

# Where state and logs live. Both must be on the Entware (USB) filesystem so
# the node identity survives a reboot.
STATE_DIR=/opt/var/lib/tailscale
LOGFILE=/opt/var/log/tailscaled.log

# Rotate the log once it exceeds this many bytes (it lives on USB flash).
LOG_MAX_BYTES=2097152
